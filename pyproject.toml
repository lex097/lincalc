[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lincalc"
version = "0.1.0"
description = "A simple linear algebra CLI"
authors = [{name = "Lex Gu", email = "lexgu314@gmail.com"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "sympy>=1.12",
]

[project.scripts]
lincalc = "lincalc.lincalc:main"